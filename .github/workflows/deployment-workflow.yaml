name: Build ghcr.io/unb-libraries/crawler.pubcrawler.lib.unb.ca

# Build and push only: the prod CronJob runs the moving `prod` tag with pullPolicy Always,
# so its next run picks up the new build. Nothing to deploy.
on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: unb-libraries/github-workflows/.github/workflows/publish-image.yaml@1.x
    with:
      image-name: ghcr.io/unb-libraries/crawler.pubcrawler.lib.unb.ca
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
